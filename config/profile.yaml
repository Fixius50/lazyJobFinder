proyectos_destacados:
  - nombre: "Sistema de Gestión de Clientes y Pedidos (Full Stack)"
    tecnologias: ["Java", "Spring Boot", "MySQL", "Hibernate", "HTML/CSS", "JavaScript"]
    descripcion: >
      Aplicación web de gestión interna con arquitectura MVC. Implementación de API RESTful
      para operaciones CRUD sobre clientes y pedidos, autenticación con sesiones y
      persistencia relacional optimizada mediante Hibernate.
    logros:
      - "Diseño completo del esquema de base de datos relacional y consultas SQL complejas."
      - "Integración de API REST documentada consumida por un frontend interactivo."

  - nombre: "Plataforma de Inventario con Acceso a Datos Multifuente"
    tecnologias: ["Java", "JDBC", "PostgreSQL", "MongoDB", "JSON/XML"]
    descripcion: >
      Herramienta de escritorio desarrollada en Java para sincronización de catálogos
      y gestión de stock, combinando almacenamiento estructurado en PostgreSQL con
      documentos NoSQL en MongoDB.
    logros:
      - "Implementación de parser de ficheros XML y JSON para importación/exportación de catálogos."
      - "Manejo eficiente de transacciones y control de concurrencia."

  - nombre: "Portal Web Dinámico de Reservas"
    tecnologias: ["PHP", "MySQL", "JavaScript", "CSS3", "Bootstrap"]
    descripcion: >
      Aplicación web para reserva de servicios, con panel de administración para usuarios
      y gestión de citas con validación en frontend y backend.
    logros:
      - "Implementación segura contra inyecciones SQL mediante sentencias preparadas PDO."
      - "Interfaz adaptable y validaciones asíncronas con JavaScript."

