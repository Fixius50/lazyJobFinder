# =============================================================================
# Docker Compose para Distribución y Producción Local de lazyJobFinder
# =============================================================================
# Versión optimizada para usuarios finales:
# - Imágenes precompiladas e importadas sin depender de builds locales
# - Sin montajes de código fuente de desarrollo
# - Puertos vinculados exclusivamente a 127.0.0.1 (seguridad y privacidad)
# - Persistencia de datos, configuración y modelos en la carpeta de instalación
# =============================================================================

name: lazyjob

services:
  # ---------------------------------------------------------------------------
  # 1. MOTOR DE IA LOCAL (Ollama)
  # ---------------------------------------------------------------------------
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: lazyjob_ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_NUM_PARALLEL=1
    networks:
      - lazyjob_net
    healthcheck:
      test: ["CMD", "/usr/bin/ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s

  # ---------------------------------------------------------------------------
  # 2. APLICACIÓN PRINCIPAL (Backend FastAPI + Frontend Unificado)
  # ---------------------------------------------------------------------------
  lazyjobfinder:
    image: ${LAZYJOB_IMAGE:-lazyjobfinder:latest}
    container_name: lazyjob_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DATABASE_PATH=/app/data/lazyjobfinder.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Datos persistentes del usuario (SQLite, CVs subidos, logs y documentos)
      - ./data:/app/data
      # Configuración del usuario (filtros de búsqueda, horarios y perfil)
      - ./config:/app/config
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - lazyjob_net

networks:
  lazyjob_net:
    driver: bridge

volumes:
  ollama_models:
    # Volumen nombrado gestionado bajo el proyecto Compose (sin fijar nombre global único)

