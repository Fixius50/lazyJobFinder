# =============================================================================
# Configuración General de lazyJobFinder (Plantilla de Distribución)
# =============================================================================
busqueda:
  terminos:
    - "Desarrollador Junior"
    - "Full Stack"
    - "Frontend"
    - "Backend"
  ubicaciones:
    - "Spain"
    - "Remoto"
  filtros_exclusion: []
  antiguedad_horas: 48
  limite_por_fuente: 15

fuentes:
  tecnoempleo_rss:
    habilitado: true
  jobspy:
    habilitado: true
    sitios:
      - indeed
      - linkedin
      - glassdoor
      - google
  infojobs_api:
    habilitado: false
    client_id: ""

evaluacion:
  umbral_minimo_puntuacion: 65
  generar_documentos: true
  idioma_documentos: "es"

notificaciones:
  guardar_en_interfaz: true
  enviar_telegram: false
  telegram:
    habilitado: false
    adjuntar_documentos: true
    notificar_solo_superan_umbral: true
    notificar_resumen_vacio: false

horario:
  hora: 8
  minuto: 30
